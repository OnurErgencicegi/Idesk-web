<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idesk | Şifre Sıfırlama</title>
<style>
  :root{
    --bg: #0b0e14; --panel: #131722; --panel-2: #1a1f2e; --line: #232838;
    --text: #eef1f6; --muted: #8b93a7; --accent: #4f7cff; --accent-2: #7c5cff;
    --good: #33c481; --danger: #ef5a6f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(124,92,255,.14), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(79,124,255,.12), transparent 55%),
      var(--bg);
    color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    width:100%;max-width:420px;padding:32px;box-shadow:0 40px 80px -20px rgba(0,0,0,.6);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:22px;}
  .brand .dot-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;
  }
  h2{font-size:22px;margin:0 0 6px;font-weight:800;}
  p.sub{color:var(--muted);font-size:14px;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px;}
  .field input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px 14px;font-size:14.5px;
  }
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn-primary{
    width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:none;color:#fff;padding:14px 26px;border-radius:10px;font-size:15.5px;font-weight:600;
    cursor:pointer;
  }
  .form-error{color:var(--danger);font-size:13px;margin:-8px 0 14px;display:none;}
  .status-msg{font-size:13px;margin-top:12px;text-align:center;display:none;}
  .status-msg.ok{color:var(--good);}
  .status-msg.err{color:var(--danger);}
  .form-note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px;}
  .form-note a{color:var(--accent);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot-mark">ID</span> Idesk</div>
    <h2>Yeni Şifre Belirle</h2>
    <p class="sub" id="introText">Hesabınız için yeni bir şifre oluşturun.</p>

    <form id="resetForm" onsubmit="return handleReset(event)">
      <div class="field">
        <label>Yeni Şifre</label>
        <input type="password" name="newPassword" minlength="6" required>
      </div>
      <div class="field">
        <label>Yeni Şifre (Tekrar)</label>
        <input type="password" name="newPasswordConfirm" minlength="6" required>
      </div>
      <div class="form-error" id="resetError"></div>
      <button class="btn-primary" type="submit">Şifreyi Güncelle</button>
      <div class="status-msg" id="resetStatus"></div>
    </form>
    <div class="form-note"><a href="/index.html">Ana sayfaya dön</a></div>
  </div>

<script>
  const API_BASE = window.IDESK_API_BASE || '/api';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if(!token){
    document.getElementById('introText').textContent = 'Geçersiz bağlantı. Lütfen "Şifremi Unuttum" akışını yeniden başlatın.';
    document.getElementById('resetForm').style.display = 'none';
  }

  async function handleReset(e){
    e.preventDefault();
    const form = new FormData(e.target);
    const errEl = document.getElementById('resetError');
    const statusEl = document.getElementById('resetStatus');
    errEl.style.display = 'none';

    const newPassword = form.get('newPassword');
    const confirm = form.get('newPasswordConfirm');
    if(newPassword !== confirm){
      errEl.textContent = 'Şifreler birbiriyle eşleşmiyor.';
      errEl.style.display = 'block';
      return false;
    }

    try{
      const res = await fetch(API_BASE + '/auth/reset-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ token, newPassword })
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok){ throw new Error(data.error || 'Bir hata oluştu.'); }

      statusEl.className = 'status-msg ok';
      statusEl.style.display = 'block';
      statusEl.textContent = data.message || 'Şifreniz güncellendi. Giriş yapabilirsiniz.';
      document.getElementById('resetForm').querySelector('button').disabled = true;
    }catch(err){
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
    return false;
  }
</script>
</body>
</html>
